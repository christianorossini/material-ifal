<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Materiais de Aula</title>
<!-- TEMPLATE 2 · MENU LATERAL — o conteúdo fica em conteudo.js -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  .app{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:100vh}
  .lateral{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--sup);border-right:1px solid var(--linha)}
  .lateral-topo{padding:20px 20px 16px;border-bottom:1px solid var(--linha)}
  .lateral nav{flex:1;overflow:auto;padding:12px}
  .lateral-pe{padding:14px 20px;border-top:1px solid var(--linha);font-size:12px;color:var(--txt-3)}
  .lk{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--raio-sm);color:var(--txt-2);text-decoration:none;font-size:14px;font-weight:500}
  .lk:hover{background:var(--sup-2);color:var(--txt)}
  .lk.ativo{background:var(--marca-50);color:var(--marca-texto)}
  .lk .ic{width:17px;height:17px}
  .area-btn{width:100%;display:flex;align-items:center;justify-content:space-between;font:inherit;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-3);background:none;border:0;padding:18px 10px 8px;cursor:pointer}
  .area-btn:hover{color:var(--txt)}
  .area-btn .ic{width:15px;height:15px;transition:transform .15s}
  .grupo.fechado .area-btn .ic{transform:rotate(-90deg)}
  .grupo.fechado .discs{display:none}
  .discs{list-style:none;margin:0;padding:0}
  .secs{list-style:none;margin:2px 0 6px 19px;padding:0 0 0 12px;border-left:1px solid var(--linha)}
  .secs button{display:flex;align-items:center;gap:8px;width:100%;font:inherit;font-size:13px;color:var(--txt-3);background:none;border:0;padding:6px 8px;border-radius:var(--raio-sm);cursor:pointer;text-align:left}
  .secs button:hover{color:var(--txt);background:var(--sup-2)}
  .secs button{align-items:flex-start;line-height:1.35}
  .secs .n{flex:none;font-size:11px;font-weight:600;color:var(--txt-3);font-variant-numeric:tabular-nums;padding-top:1px}
  .secs button.ativo{color:var(--marca-texto);background:var(--marca-50)}
  .topo-movel{display:none}

  .principal{min-width:0}
  .cabeca{padding:44px 48px 28px;border-bottom:1px solid var(--linha);background:var(--sup)}
  .conteudo{padding:32px 48px 0;max-width:920px}
  .principal .rodape{margin-top:48px}
  .principal .rodape .wrap{max-width:none;padding:0 48px}

  @media (max-width:900px){
    .app{display:block}
    .topo-movel{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;background:var(--sup);border-bottom:1px solid var(--linha);padding:10px 16px}
    .topo-movel button{background:none;border:1px solid var(--linha);border-radius:var(--raio-sm);padding:7px;color:var(--txt);cursor:pointer;display:inline-flex}
    .topo-movel .ic{width:20px;height:20px}
    .lateral{display:none;position:fixed;inset:57px 0 0 0;height:auto;z-index:19}
    .lateral.aberto{display:flex}
    .lateral-topo{display:none}
    .cabeca{padding:28px 16px 22px}
    .conteudo{padding:20px 16px 0}
    .principal .rodape .wrap{padding:0 16px}
  }
</style>
</head>
<body>
<div class="topo-movel">
  <a class="marca" href="#"><span class="marca-sigla">MA</span><span class="marca-nome"><b data-site="titulo"></b><small data-site="instituicao"></small></span></a>
  <button id="hamb" aria-label="Abrir menu" aria-expanded="false"></button>
</div>
<div class="app">
  <aside class="lateral" id="lateral">
    <div class="lateral-topo"><a class="marca" href="#"><span class="marca-sigla">MA</span><span class="marca-nome"><b data-site="titulo"></b><small data-site="instituicao"></small></span></a></div>
    <nav aria-label="Áreas e disciplinas" id="arvore"></nav>
    <div class="lateral-pe" data-site="autor"></div>
  </aside>
  <div class="principal">
    <div id="conteudo"></div>
    <footer class="rodape"><div class="wrap"><span data-site="aviso"></span></div></footer>
  </div>
</div>

<script src="conteudo.js"></script>
<script src="comum.js"></script>
<script>
$("hamb").innerHTML = ICONE.menu;
$("hamb").addEventListener("click", () => { const n = $("lateral").classList.toggle("aberto"); $("hamb").setAttribute("aria-expanded", n); $("hamb").innerHTML = n ? ICONE.fechar : ICONE.menu; });

function arvore(atual){
  $("arvore").innerHTML = `<a class="lk ${!atual.area ? "ativo" : ""}" href="#">${ICONE.inicio}Início</a>` + MENU.map(a => `
    <div class="grupo" data-id="${esc(a.id)}">
      <button class="area-btn" aria-expanded="true">${esc(a.titulo)}${ICONE.baixo}</button>
      <ul class="discs">
        ${a.disciplinas.map(d => `<li><a class="lk ${d === atual.disc ? "ativo" : ""}" href="#${esc(a.id)}/${esc(d.id)}">${ICONE.direita}${esc(d.titulo)}</a>
          ${d === atual.disc ? `<ul class="secs">${(d.assuntos || []).map((s,k) => `<li><button type="button" data-ir="as-${esc(s.id)}" class="${s === atual.assunto ? "ativo" : ""}"><span class="n">${String(k+1).padStart(2,"0")}</span>${esc(s.titulo)}</button></li>`).join("")}</ul>` : ""}</li>`).join("")}
      </ul>
    </div>`).join("");
  document.querySelectorAll(".area-btn").forEach(b => b.addEventListener("click", () => {
    const f = b.parentElement.classList.toggle("fechado"); b.setAttribute("aria-expanded", !f);
  }));
}
const trilha = (...p) => `<nav class="trilha" aria-label="Você está em"><a href="#">Início</a>${p.map(x => `<span class="sep">/</span>${x}`).join("")}</nav>`;

iniciar(atual => {
  const { area, disc } = atual;
  let h;
  if (disc) {
    h = `<header class="cabeca">${trilha(`<a href="#${esc(area.id)}">${esc(area.titulo)}</a>`, `<span>${esc(disc.titulo)}</span>`)}
        <h1 class="titulo-pag">${esc(disc.titulo)}</h1><p class="desc-pag">${esc(disc.descricao)}</p></header>
      <div class="conteudo">${barraHTML(disc)}${assuntosHTML(area, disc, atual.assunto)}</div>`;
  } else if (area) {
    h = `<header class="cabeca">${trilha(`<span>${esc(area.titulo)}</span>`)}<h1 class="titulo-pag">${esc(area.titulo)}</h1><p class="desc-pag">${esc(area.descricao)}</p></header>
      <div class="conteudo"><div class="cartoes">${area.disciplinas.map(d => cartaoHTML(area, d)).join("")}</div></div>`;
  } else {
    h = `<header class="cabeca"><p class="sobretitulo">${esc(SITE.instituicao)}</p><h1 class="titulo-pag">${esc(SITE.titulo)}</h1>
        <p class="desc-pag">Apresentações, exercícios, experimentos e apostilas, organizados por disciplina e assunto. Escolha uma disciplina no menu ou abaixo.</p></header>
      <div class="conteudo">${MENU.map(a => `<section class="area"><div class="area-h"><h2>${esc(a.titulo)}</h2><a href="#${esc(a.id)}">Ver área →</a></div>
        <p class="area-d">${esc(a.descricao)}</p><div class="cartoes">${a.disciplinas.map(d => cartaoHTML(a, d)).join("")}</div></section>`).join("")}</div>`;
  }
  $("conteudo").innerHTML = h;
  arvore(atual);
  $("lateral").classList.remove("aberto"); $("hamb").innerHTML = ICONE.menu;
});
document.addEventListener("toggle", e => {
  if (e.target.classList?.contains("assunto") && e.target.open)
    document.querySelectorAll(".secs button").forEach(b => b.classList.toggle("ativo", b.dataset.ir === e.target.id));
}, true);
document.addEventListener("click", e => { if (e.target.closest(".secs [data-ir]")) { $("lateral").classList.remove("aberto"); $("hamb").innerHTML = ICONE.menu; } });
</script>
</body>
</html>
