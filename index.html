document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

<\u002Fa>\n      <a href=\"#cap8\" style=\"flex: none; font-size: 13px; padding: 6px 12px; border-radius: 999px; background: #fff; border: 1px solid #e2e2dd; color: #2c313c; text-decoration: none;\" style-hover=\"border-color: #2a56c6; color: #2a56c6;\">8 · Programas<\u002Fa>\n      <a href=\"#gabarito\" style=\"flex: none; font-size: 13px; padding: 6px 12px; border-radius: 999px; background: #171a20; border: 1px solid #171a20; color: #fff; text-decoration: none;\" style-hover=\"background: #2a56c6; border-color: #2a56c6;\">Gabarito<\u002Fa>\n      <a href=\"#atalhos\" style=\"flex: none; font-size: 13px; padding: 6px 12px; border-radius: 999px; background: #fff; border: 1px solid #e2e2dd; color: #2c313c; text-decoration: none;\" style-hover=\"border-color: #2a56c6; color: #2a56c6;\">Atalhos<\u002Fa>\n      <a href=\"#glossario\" style=\"flex: none; font-size: 13px; padding: 6px 12px; border-radius: 999px; background: #fff; border: 1px solid #e2e2dd; color: #2c313c; text-decoration: none;\" style-hover=\"border-color: #2a56c6; color: #2a56c6;\">Glossário<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"topo\" style=\"max-width: 940px; margin: 0 auto; padding: 0 18px 90px;\">\n\n    <div style=\"padding: 56px 0 36px; border-bottom: 1px solid #e2e2dd;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: #5a6070; text-transform: uppercase;\">Apostila de estudos<\u002Fdiv>\n      <h1 style=\"font-family: 'Libre Franklin', sans-serif; font-size: clamp(34px, 7vw, 54px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; margin: 14px 0 10px;\">Windows 11 — Básico<\u002Fh1>\n      <p style=\"font-size: 17px; color: #5a6070; margin: 0 0 22px;\">Informática Aplicada · Prof. Christiano · IFAL Campus Maceió · 2026<\u002Fp>\n      <div style=\"background: #fff; border: 1px solid #e2e2dd; border-radius: 10px; padding: 18px 20px;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #2a56c6; text-transform: uppercase; margin-bottom: 8px;\">Sobre esta apostila<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #2c313c;\">Apostila de estudos para o módulo de Windows 11 Básico. Cada capítulo apresenta resumo teórico com simulações visuais de tela, seguido de 7 questões objetivas com 5 alternativas. O gabarito completo está na seção final.<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin: 18px 0 0; font-size: 14px; color: #5a6070;\">Nesta versão interativa, as questões são respondidas na própria página: escolha uma alternativa para ver na hora se acertou. Seu progresso fica salvo neste navegador.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"padding: 34px 0 10px;\">\n      <h2 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 16px;\">Sumário<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px 24px;\">\n        <a href=\"#cap1\" style=\"display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eaeae5; text-decoration: none; color: #171a20;\" style-hover=\"color: #2a56c6;\"><span style=\"font-family: 'JetBrains Mono', monospace; color: #9aa0ac; font-size: 14px;\">01<\u002Fspan><span style=\"font-size: 15.5px;\">Interface e Área de Trabalho<\u002Fspan><\u002Fa>\n        <a href=\"#cap2\" style=\"display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eaeae5; text-decoration: none; color: #171a20;\" style-hover=\"color: #2a56c6;\"><span style=\"font-family: 'JetBrains Mono', monospace; color: #9aa0ac; font-size: 14px;\">02<\u002Fspan><span style=\"font-size: 15.5px;\">Mouse e Teclado<\u002Fspan><\u002Fa>\n        <a href=\"#cap3\" style=\"display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eaeae5; text-decoration: none; color: #171a20;\" style-hover=\"color: #2a56c6;\"><span style=\"font-family: 'JetBrains Mono', monospace; color: #9aa0ac; font-size: 14px;\">03<\u002Fspan><span style=\"font-size: 15.5px;\">Janelas e Multitarefa<\u002Fspan><\u002Fa>\n        <a href=\"#cap4\" style=\"display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eaeae5; text-decoration: none; color: #171a20;\" style-hover=\"color: #2a56c6;\"><span style=\"font-family: 'JetBrains Mono', monospace; color: #9aa0ac; font-size: 14px;\">04<\u002Fspan><span style=\"font-size: 15.5px;\">Hierarquia de Arquivos e Pastas<\u002Fspan><\u002Fa>\n        <a href=\"#cap5\" style=\"display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eaeae5; text-decoration: none; color: #171a20;\" style-hover=\"color: #2a56c6;\"><span style=\"font-family: 'JetBrains Mono', monospace; color: #9aa0ac; font-size: 14px;\">05<\u002Fspan><span style=\"font-size: 15.5px;\">Criação e Manipulação de Arquivos<\u002Fspan><\u002Fa>\n        <a href=\"#cap6\" style=\"display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eaeae5; text-decoration: none; color: #171a20;\" style-hover=\"color: #2a56c6;\"><span style=\"font-family: 'JetBrains Mono', monospace; color: #9aa0ac; font-size: 14px;\">06<\u002Fspan><span style=\"font-size: 15.5px;\">Extensões de Arquivo<\u002Fspan><\u002Fa>\n        <a href=\"#cap7\" style=\"display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eaeae5; text-decoration: none; color: #171a20;\" style-hover=\"color: #2a56c6;\"><span style=\"font-family: 'JetBrains Mono', monospace; color: #9aa0ac; font-size: 14px;\">07<\u002Fspan><span style=\"font-size: 15.5px;\">Pesquisa e Localização de Arquivos<\u002Fspan><\u002Fa>\n        <a href=\"#cap8\" style=\"display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eaeae5; text-decoration: none; color: #171a20;\" style-hover=\"color: #2a56c6;\"><span style=\"font-family: 'JetBrains Mono', monospace; color: #9aa0ac; font-size: 14px;\">08<\u002Fspan><span style=\"font-size: 15.5px;\">Instalação e Desinstalação de Programas<\u002Fspan><\u002Fa>\n        <a href=\"#gabarito\" style=\"display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eaeae5; text-decoration: none; color: #171a20;\" style-hover=\"color: #2a56c6;\"><span style=\"font-family: 'JetBrains Mono', monospace; color: #9aa0ac; font-size: 14px;\">·<\u002Fspan><span style=\"font-size: 15.5px;\">Gabarito — 56 Questões<\u002Fspan><\u002Fa>\n        <a href=\"#atalhos\" style=\"display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eaeae5; text-decoration: none; color: #171a20;\" style-hover=\"color: #2a56c6;\"><span style=\"font-family: 'JetBrains Mono', monospace; color: #9aa0ac; font-size: 14px;\">·<\u002Fspan><span style=\"font-size: 15.5px;\">Tabela Consolidada de Atalhos<\u002Fspan><\u002Fa>\n        <a href=\"#glossario\" style=\"display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eaeae5; text-decoration: none; color: #171a20;\" style-hover=\"color: #2a56c6;\"><span style=\"font-family: 'JetBrains Mono', monospace; color: #9aa0ac; font-size: 14px;\">·<\u002Fspan><span style=\"font-size: 15.5px;\">Glossário<\u002Fspan><\u002Fa>\n        <a href=\"#dicas\" style=\"display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eaeae5; text-decoration: none; color: #171a20;\" style-hover=\"color: #2a56c6;\"><span style=\"font-family: 'JetBrains Mono', monospace; color: #9aa0ac; font-size: 14px;\">·<\u002Fspan><span style=\"font-size: 15.5px;\">Dicas para a Avaliação<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"cap1\" style=\"padding: 52px 0 0;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; color: #2a56c6; text-transform: uppercase;\">Capítulo 1<\u002Fdiv>\n      <h2 style=\"font-family: 'Libre Franklin', sans-serif; font-size: clamp(26px, 5vw, 36px); font-weight: 600; letter-spacing: -0.025em; margin: 8px 0 24px;\">Interface e Área de Trabalho<\u002Fh2>\n\n      <h3 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 19px; font-weight: 600; margin: 30px 0 10px;\">O que é a interface gráfica do Windows 11<\u002Fh3>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px; text-wrap: pretty;\">A interface gráfica do usuário (GUI — Graphical User Interface) é a camada visual que permite interagir com o computador usando elementos como ícones, janelas e botões, em vez de comandos de texto. O Windows 11 é inteiramente baseado em GUI. o Windows 11 trouxe mudanças visuais significativas: a Barra de Tarefas tem ícones centralizados por padrão, as janelas têm cantos arredondados, o Menu Iniciar foi redesenhado e a Central de Ações foi aprimorada.<\u002Fp>\n\n      <div style=\"background: #eef2fd; border: 1px solid #d7e0f8; border-radius: 10px; padding: 16px 18px; margin: 18px 0;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #2a56c6; text-transform: uppercase; margin-bottom: 6px;\">Conceito — Área de Trabalho<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #2c313c;\">O fundo da tela do Windows 11 onde ficam os ícones de acesso rápido e as janelas dos programas abertos. É o ponto de partida para todo o trabalho no computador.<\u002Fp>\n      <\u002Fdiv>\n\n      <h3 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 19px; font-weight: 600; margin: 30px 0 10px;\">Simulação — Área de Trabalho com elementos numerados<\u002Fh3>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px;\">A simulação abaixo representa a tela do Windows 11 logo após o carregamento. Observe cada elemento numerado e consulte a legenda:<\u002Fp>\n      <figure style=\"margin: 0 0 18px;\">\n        <dc-import name=\"Simulacao\" tipo=\"desktop\" hint-size=\"100%,420px\"><\u002Fdc-import>\n      <\u002Ffigure>\n      <div style=\"overflow-x: auto; margin: 0 0 18px; border: 1px solid #e2e2dd; border-radius: 10px; background: #fff;\">\n        <sc-raw-table style=\"width: 100%; min-width: 560px; border-collapse: collapse; font-size: 14.5px;\">\n          <sc-raw-thead><sc-raw-tr>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Nº<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Elemento<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Localização na tela<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Função<\u002Fsc-raw-th>\n          <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">①<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Área de Trabalho<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Fundo da tela<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Espaço onde ficam ícones e janelas abertas<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">②<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Botão Iniciar (⊞)<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Barra de tarefas — esq.<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Abre o Menu Iniciar do Windows 11<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">③<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Pesquisa<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Barra de tarefas — centro<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Busca programas e arquivos<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">④<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Apps fixados<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Centro da barra<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Acesso rápido aos programas favoritos<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">⑤<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Ícone da Lixeira<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Área de Trabalho<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Armazena arquivos excluídos temporariamente<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">⑥<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Ícone Este PC<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Área de Trabalho<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Acessa discos e pastas do computador<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">⑦<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Bandeja do sistema<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Barra de tarefas — direita<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Rede, volume e notificações<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px;\">⑧<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Relógio / Data<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Barra de tarefas — extremo dir.<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Hora e data do sistema<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n\n      <h3 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 19px; font-weight: 600; margin: 30px 0 10px;\">Como abrir programas no Windows 11<\u002Fh3>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px;\">Existem quatro formas principais de abrir um programa. Cada uma é mais adequada para uma situação diferente:<\u002Fp>\n      <div style=\"overflow-x: auto; margin: 0 0 18px; border: 1px solid #e2e2dd; border-radius: 10px; background: #fff;\">\n        <sc-raw-table style=\"width: 100%; min-width: 560px; border-collapse: collapse; font-size: 14.5px;\">\n          <sc-raw-thead><sc-raw-tr>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Método<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Como fazer<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Quando usar<\u002Fsc-raw-th>\n          <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Menu Iniciar<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Pressione Win e clique no programa fixado ou em Todos os aplicativos<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Para abrir qualquer programa, especialmente os que não têm ícone na tela<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Pesquisa rápida<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Pressione Win e comece a digitar o nome — Enter abre o primeiro resultado<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Para abrir rapidamente sem precisar navegar<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Ícone na Área de Trabalho<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Duplo clique no ícone do programa<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Para programas usados com frequência que estão na tela<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px;\">Barra de Tarefas<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Clique no ícone fixado na barra inferior<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Para os programas mais usados no dia a dia<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n      <div style=\"background: #eef2fd; border: 1px solid #d7e0f8; border-radius: 10px; padding: 16px 18px; margin: 18px 0;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #2a56c6; text-transform: uppercase; margin-bottom: 6px;\">Dica Windows 11<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #2c313c;\">Pressione Win e comece a digitar qualquer nome — a pesquisa abre automaticamente sem precisar clicar em campo algum. Funciona para programas, arquivos e configurações.<\u002Fp>\n      <\u002Fdiv>\n\n      <h3 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 19px; font-weight: 600; margin: 30px 0 10px;\">Anatomia de uma janela — simulação visual<\u002Fh3>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px;\">Toda janela do Windows 11 segue a mesma estrutura. Reconhecer cada elemento evita erros comuns — por exemplo, saber que o botão — não fecha, mas apenas oculta a janela:<\u002Fp>\n      <figure style=\"margin: 0 0 18px;\">\n        <dc-import name=\"Simulacao\" tipo=\"janela\" hint-size=\"100%,420px\"><\u002Fdc-import>\n      <\u002Ffigure>\n\n      <h3 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 19px; font-weight: 600; margin: 30px 0 10px;\">O que cada botão de controle faz<\u002Fh3>\n      <div style=\"overflow-x: auto; margin: 0 0 18px; border: 1px solid #e2e2dd; border-radius: 10px; background: #fff;\">\n        <sc-raw-table style=\"width: 100%; min-width: 560px; border-collapse: collapse; font-size: 14.5px;\">\n          <sc-raw-thead><sc-raw-tr>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Botão<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Nome<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">O que acontece<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">O programa continua?<\u002Fsc-raw-th>\n          <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">—<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Minimizar<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">A janela desaparece da tela; ícone permanece na Barra de Tarefas<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Sim — continua em execução<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">□<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Maximizar / Restaurar<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Expande para tela cheia (ou retorna ao tamanho anterior)<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Sim — continua em execução<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; font-family: 'JetBrains Mono', monospace;\">×<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Fechar<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">A janela é encerrada completamente<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Não — programa finalizado<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n      <div style=\"background: #fdf2e8; border: 1px solid #f3ddc4; border-radius: 10px; padding: 16px 18px; margin: 18px 0;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #a75a1f; text-transform: uppercase; margin-bottom: 6px;\">Atenção<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #2c313c;\">Minimizar não é fechar. Ao clicar em — a janela desaparece, mas o programa continua rodando. O ícone fica na Barra de Tarefas — clique nele para restaurar a janela com o conteúdo intacto.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #fff; border: 1px solid #e2e2dd; border-radius: 10px; padding: 16px 18px; margin: 18px 0;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #12795f; text-transform: uppercase; margin-bottom: 6px;\">Exemplo prático<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #2c313c;\">Você está digitando um texto e precisa consultar um arquivo. Clique em — para minimizar o editor, abra o Explorador, consulte o arquivo e clique no ícone do editor na Barra de Tarefas para restaurar. O texto estará exatamente como você deixou.<\u002Fp>\n      <\u002Fdiv>\n\n      <h3 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 19px; font-weight: 600; margin: 30px 0 10px;\">Central de Ações do Windows 11<\u002Fh3>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px;\">No Windows 11, clicar no relógio ou na área de notificações (canto inferior direito) abre a Central de Ações — um painel com notificações do sistema e atalhos rápidos para Wi-Fi, volume, brilho e modo avião. O atalho de teclado é Win + N. Diferente do Windows 10, essa central foi unificada em um único painel mais completo.<\u002Fp>\n\n      <dc-import name=\"BlocoQuestoes\" questoes=\"{{ cap1 }}\" placar=\"{{ placar1 }}\" hint-size=\"100%,600px\"><\u002Fdc-import>\n    <\u002Fdiv>\n\n    <div id=\"cap2\" style=\"padding: 64px 0 0;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; color: #2a56c6; text-transform: uppercase;\">Capítulo 2<\u002Fdiv>\n      <h2 style=\"font-family: 'Libre Franklin', sans-serif; font-size: clamp(26px, 5vw, 36px); font-weight: 600; letter-spacing: -0.025em; margin: 8px 0 24px;\">Mouse e Teclado<\u002Fh2>\n\n      <h3 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 19px; font-weight: 600; margin: 30px 0 10px;\">O mouse e os tipos de interação<\u002Fh3>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px; text-wrap: pretty;\">O mouse é o principal dispositivo de apontamento do computador. Cada forma de usar seus botões produz um resultado diferente. Dominar todos os tipos de clique — não apenas o clique simples — é essencial para trabalhar com eficiência no Windows 11.<\u002Fp>\n      <figure style=\"margin: 0 0 18px;\">\n        <dc-import name=\"Simulacao\" tipo=\"mouse\" hint-size=\"100%,280px\"><\u002Fdc-import>\n      <\u002Ffigure>\n      <div style=\"overflow-x: auto; margin: 0 0 18px; border: 1px solid #e2e2dd; border-radius: 10px; background: #fff;\">\n        <sc-raw-table style=\"width: 100%; min-width: 620px; border-collapse: collapse; font-size: 14.5px;\">\n          <sc-raw-thead><sc-raw-tr>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Tipo de clique<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Como executar<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Resultado<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Exemplo de uso<\u002Fsc-raw-th>\n          <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">① Clique simples<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Pressionar botão esq. 1x<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Seleciona o item — fica destacado em azul<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Selecionar um arquivo antes de copiar<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Duplo clique<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Pressionar botão esq. 2x rápido<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Abre o arquivo ou executa o programa<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Abrir uma pasta ou documento<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">② Clique direito<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Pressionar botão dir. 1x<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Abre o menu de contexto com opções do item<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Ver opções de Copiar, Renomear, Propriedades<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">③ Scroll<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Girar a rodinha do mouse<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Rola o conteúdo da tela para cima ou baixo<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Rolar uma página longa ou lista<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px;\">④ Arrastar e soltar<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Clicar + segurar + mover + soltar<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Move o objeto para o local onde foi solto<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Mover arquivo de uma pasta para outra<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n      <div style=\"background: #eef2fd; border: 1px solid #d7e0f8; border-radius: 10px; padding: 16px 18px; margin: 18px 0;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #2a56c6; text-transform: uppercase; margin-bottom: 6px;\">Dica — Menu de contexto<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #2c313c;\">O clique direito é um dos recursos mais úteis do Windows 11. Clique com o botão direito sobre qualquer elemento — arquivo, pasta, Área de Trabalho, ícone da Barra de Tarefas — para ver todas as opções disponíveis para aquele item específico.<\u002Fp>\n      <\u002Fdiv>\n\n      <h3 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 19px; font-weight: 600; margin: 30px 0 10px;\">Área de Transferência — o que é e como funciona<\u002Fh3>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px;\">A Área de Transferência (Clipboard) é um espaço temporário na memória RAM onde ficam guardados os dados copiados ou recortados. Funciona como uma prancheta virtual: Ctrl+C copia para essa área; Ctrl+V cola a partir dela. Por padrão, a Área de Transferência guarda apenas o último item copiado — ao copiar um novo, o anterior é perdido.<\u002Fp>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px;\">O Windows 11 oferece um histórico da Área de Transferência acessível pelo atalho Win+V. Ele guarda os últimos itens copiados e permite selecionar qual colar, útil quando você precisa colar vários itens diferentes.<\u002Fp>\n      <div style=\"background: #eef2fd; border: 1px solid #d7e0f8; border-radius: 10px; padding: 16px 18px; margin: 18px 0;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #2a56c6; text-transform: uppercase; margin-bottom: 6px;\">Conceito — Área de Transferência<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #2c313c;\">Espaço temporário na memória RAM onde ficam dados copiados ou recortados. Persiste até ser substituído por uma nova cópia ou até o computador ser desligado.<\u002Fp>\n      <\u002Fdiv>\n\n      <h3 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 19px; font-weight: 600; margin: 30px 0 10px;\">Atalhos de teclado — lógica e organização<\u002Fh3>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px;\">Os atalhos de teclado usam teclas modificadoras (Ctrl, Alt, Win) combinadas com outras teclas. Entender a lógica facilita a memorização:<\u002Fp>\n      <div style=\"overflow-x: auto; margin: 0 0 18px; border: 1px solid #e2e2dd; border-radius: 10px; background: #fff;\">\n        <sc-raw-table style=\"width: 100%; min-width: 620px; border-collapse: collapse; font-size: 14.5px;\">\n          <sc-raw-thead><sc-raw-tr>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Tecla modificadora<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Para que serve<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Exemplos<\u002Fsc-raw-th>\n          <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Ctrl (Control)<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Operações de edição de texto e arquivos<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Ctrl+C (copiar), Ctrl+V (colar), Ctrl+Z (desfazer), Ctrl+S (salvar)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Alt (Alternate)<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Navegação entre janelas e ações de programa<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Alt+Tab (alternar), Alt+F4 (fechar)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Win (Windows)<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Operações do sistema operacional<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Win+D (desktop), Win+E (explorador), Win+I (configurações)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Shift + tecla<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Modificar comportamento padrão de uma ação<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Shift+Delete (excluir permanente), Shift+clique (seleção múltipla)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px;\">F2 / teclas de função<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Ações rápidas dependentes do contexto<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">F2 (renomear), F5 (atualizar a pasta)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n      <div style=\"overflow-x: auto; margin: 0 0 18px; border: 1px solid #e2e2dd; border-radius: 10px; background: #fff;\">\n        <sc-raw-table style=\"width: 100%; min-width: 560px; border-collapse: collapse; font-size: 14.5px;\">\n          <sc-raw-thead><sc-raw-tr>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Atalho<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Ação<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Resultado visível<\u002Fsc-raw-th>\n          <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">Ctrl + C<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Copiar<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Conteúdo vai para a Área de Transferência<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">Ctrl + V<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Colar<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Conteúdo copiado aparece no destino<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">Ctrl + X<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Recortar<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Remove da origem; disponível para colar em outro local<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">Ctrl + Z<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Desfazer<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">A última ação é revertida — desfaz sequencialmente<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">Ctrl + A<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Selecionar tudo<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Todo o conteúdo da janela/pasta fica selecionado<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">Ctrl + S<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Salvar<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Salva o arquivo atual (abre Salvar como na 1ª vez)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">Alt + Tab<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Alternar janelas<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Seletor de janelas aparece; soltar vai para a janela<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">Alt + F4<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Fechar programa<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">A janela ativa é encerrada<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">Win + D<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Minimizar tudo<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Área de Trabalho fica visível; todas as janelas somem<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">Win + E<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Abrir Explorador<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Abre o Explorador de Arquivos em Este PC<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">Win + Shift + S<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Captura de área<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Seleciona área para capturar; imagem vai para a transferência<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; font-family: 'JetBrains Mono', monospace;\">F2<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Renomear<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Nome do item selecionado fica editável no Explorador<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n      <div style=\"background: #fff; border: 1px solid #e2e2dd; border-radius: 10px; padding: 16px 18px; margin: 18px 0;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #12795f; text-transform: uppercase; margin-bottom: 6px;\">Por que Ctrl+Z é tão importante<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #2c313c;\">Você estava editando um documento e acidentalmente apagou um parágrafo inteiro. Pressionar Ctrl+Z imediatamente desfaz a última ação e o parágrafo volta. Pressionar Ctrl+Z várias vezes desfaz múltiplas ações em sequência — o Windows 11 mantém um histórico completo de ações desfazíveis.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #fdf2e8; border: 1px solid #f3ddc4; border-radius: 10px; padding: 16px 18px; margin: 18px 0;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #a75a1f; text-transform: uppercase; margin-bottom: 6px;\">Atenção — Ctrl+X vs Ctrl+C<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #2c313c;\">Ctrl+X recorta e remove da origem assim que você cola em outro lugar. Use Ctrl+C quando quiser manter o original e criar uma cópia. Se usou Ctrl+X e ainda não colou, o item ainda estará no lugar original — cole antes de fazer qualquer outra ação.<\u002Fp>\n      <\u002Fdiv>\n\n      <dc-import name=\"BlocoQuestoes\" questoes=\"{{ cap2 }}\" placar=\"{{ placar2 }}\" hint-size=\"100%,600px\"><\u002Fdc-import>\n    <\u002Fdiv>\n\n    <div id=\"cap3\" style=\"padding: 64px 0 0;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; color: #2a56c6; text-transform: uppercase;\">Capítulo 3<\u002Fdiv>\n      <h2 style=\"font-family: 'Libre Franklin', sans-serif; font-size: clamp(26px, 5vw, 36px); font-weight: 600; letter-spacing: -0.025em; margin: 8px 0 24px;\">Janelas e Multitarefa<\u002Fh2>\n\n      <h3 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 19px; font-weight: 600; margin: 30px 0 10px;\">Os quatro estados de uma janela — simulação visual<\u002Fh3>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px; text-wrap: pretty;\">Entender como as janelas se comportam é fundamental para trabalhar com eficiência. Transitar com precisão entre os quatro estados economiza tempo e evita confusão durante o uso do computador. A simulação abaixo mostra como cada estado aparece na tela:<\u002Fp>\n      <figure style=\"margin: 0 0 18px;\">\n        <dc-import name=\"Simulacao\" tipo=\"estados\" hint-size=\"100%,320px\"><\u002Fdc-import>\n      <\u002Ffigure>\n      <div style=\"overflow-x: auto; margin: 0 0 18px; border: 1px solid #e2e2dd; border-radius: 10px; background: #fff;\">\n        <sc-raw-table style=\"width: 100%; min-width: 620px; border-collapse: collapse; font-size: 14.5px;\">\n          <sc-raw-thead><sc-raw-tr>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Estado<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Botão acionado<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">O que aparece na tela<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Como retornar<\u002Fsc-raw-th>\n          <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Maximizado<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">□ (primeira vez)<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Janela ocupa toda a tela; botão □ muda de aparência<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Clicar em □ novamente (restaurar)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Restaurado<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">□ (segunda vez)<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Janela em tamanho parcial; desktop e bordas visíveis<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Clicar em □ (maximizar) ou — (minimizar)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Minimizado<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">— (traço)<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Janela invisível na tela; ícone permanece na Barra de Tarefas<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Clicar no ícone na Barra de Tarefas<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px;\">Fechado<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">× (xis) ou Alt+F4<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Programa encerrado; janela e ícone desaparecem completamente<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Abrir o programa do zero novamente<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n      <div style=\"background: #eef2fd; border: 1px solid #d7e0f8; border-radius: 10px; padding: 16px 18px; margin: 18px 0;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #2a56c6; text-transform: uppercase; margin-bottom: 6px;\">Dica — Redimensionar uma janela restaurada<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #2c313c;\">Quando uma janela está no estado Restaurado, você pode ajustar seu tamanho arrastando qualquer borda ou canto com o mouse. Arrastando o canto inferior direito, você muda largura e altura simultaneamente.<\u002Fp>\n      <\u002Fdiv>\n\n      <h3 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 19px; font-weight: 600; margin: 30px 0 10px;\">Snap — dividir a tela com o teclado<\u002Fh3>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px;\">O Snap é um recurso que organiza duas ou mais janelas na tela automaticamente. É especialmente útil quando você precisa consultar uma informação em um programa enquanto trabalha em outro — como ler um roteiro de experimento enquanto preenche um relatório, ou comparar dois documentos lado a lado.<\u002Fp>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px;\">Para usar o Snap pelo teclado: clique na janela que deseja fixar para ativá-la, depois pressione Win+Seta Esquerda. A janela ocupa a metade esquerda da tela e o Windows automaticamente exibe as outras janelas abertas no lado direito para você escolher qual ocupar a outra metade.<\u002Fp>\n      <figure style=\"margin: 0 0 18px;\">\n        <dc-import name=\"Simulacao\" tipo=\"snap\" hint-size=\"100%,360px\"><\u002Fdc-import>\n      <\u002Ffigure>\n      <div style=\"background: #fff; border: 1px solid #e2e2dd; border-radius: 10px; padding: 16px 18px; margin: 18px 0;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #12795f; text-transform: uppercase; margin-bottom: 6px;\">Exemplo prático — Snap no laboratório<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #2c313c;\">Você precisa preencher um relatório no Bloco de Notas consultando dados no Explorador. Use Win+Seta Esquerda no Bloco de Notas (vai para a esquerda), depois clique no Explorador que aparece à direita. Agora você vê os dois programas simultaneamente, sem alternar de janela.<\u002Fp>\n      <\u002Fdiv>\n\n      <h3 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 19px; font-weight: 600; margin: 30px 0 10px;\">Snap — dividir a tela com o mouse<\u002Fh3>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px;\">No Windows 11 o Snap pode ser ativado de duas formas usando o mouse. Ambas produzem o mesmo resultado, mas são acionadas de maneiras diferentes:<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin: 0 0 18px;\">\n        <div style=\"background: #fff; border: 1px solid #e2e2dd; border-radius: 10px; padding: 16px 18px;\">\n          <div style=\"font-family: 'Libre Franklin', sans-serif; font-size: 15px; font-weight: 600; margin-bottom: 8px;\">Método A — Arrastar para a borda<\u002Fdiv>\n          <ol style=\"margin: 0 0 8px; padding-left: 18px; font-size: 15px; line-height: 1.6; color: #2c313c;\">\n            <li>Clique e segure a barra de título da janela<\u002Fli>\n            <li>Arraste a janela até a borda ESQUERDA ou DIREITA da tela<\u002Fli>\n            <li>Quando um contorno aparecer, solte o mouse<\u002Fli>\n          <\u002Fol>\n          <p style=\"margin: 0; font-size: 14.5px; color: #12795f;\">→ A janela encaixa automaticamente na metade da tela<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #fff; border: 1px solid #e2e2dd; border-radius: 10px; padding: 16px 18px;\">\n          <div style=\"font-family: 'Libre Franklin', sans-serif; font-size: 15px; font-weight: 600; margin-bottom: 8px;\">Método B — Hover no botão Maximizar<\u002Fdiv>\n          <ol style=\"margin: 0 0 8px; padding-left: 18px; font-size: 15px; line-height: 1.6; color: #2c313c;\">\n            <li>Passe o mouse (sem clicar) sobre o botão □ (maximizar)<\u002Fli>\n            <li>Um menu de layouts de Snap aparece automaticamente<\u002Fli>\n            <li>Clique na posição desejada no layout exibido<\u002Fli>\n          <\u002Fol>\n          <p style=\"margin: 0; font-size: 14.5px; color: #12795f;\">→ A janela ocupa o espaço selecionado no layout<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px;\">O Método B é exclusivo do Windows 11: ao passar o mouse lentamente sobre o botão □ (maximizar) sem clicar, um menu de layouts de Snap aparece em menos de um segundo. Você clica na posição desejada no layout para encaixar a janela — isso permite arranjos além das duas metades, como três colunas ou um quadrante maior com dois menores.<\u002Fp>\n      <div style=\"background: #eef2fd; border: 1px solid #d7e0f8; border-radius: 10px; padding: 16px 18px; margin: 18px 0;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #2a56c6; text-transform: uppercase; margin-bottom: 6px;\">Dica Windows 11 — Snap Layouts<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #2c313c;\">O menu de Snap Layouts que aparece ao fazer hover no botão □ oferece múltiplos arranjos: duas metades, três colunas, uma janela grande com duas pequenas, e quatro quadrantes. Em monitores maiores, os arranjos com mais janelas são especialmente produtivos.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #fdf2e8; border: 1px solid #f3ddc4; border-radius: 10px; padding: 16px 18px; margin: 18px 0;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #a75a1f; text-transform: uppercase; margin-bottom: 6px;\">Atenção<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #2c313c;\">Snap divide a tela em duas metades iguais (50/50) quando usado com Win+Seta. Para arranjos diferentes, use o menu de Snap Layouts (hover no botão □) ou arraste a janela para um canto da tela para o modo de quadrante.<\u002Fp>\n      <\u002Fdiv>\n\n      <dc-import name=\"BlocoQuestoes\" questoes=\"{{ cap3 }}\" placar=\"{{ placar3 }}\" hint-size=\"100%,600px\"><\u002Fdc-import>\n    <\u002Fdiv>\n\n    <div id=\"cap4\" style=\"padding: 64px 0 0;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; color: #2a56c6; text-transform: uppercase;\">Capítulo 4<\u002Fdiv>\n      <h2 style=\"font-family: 'Libre Franklin', sans-serif; font-size: clamp(26px, 5vw, 36px); font-weight: 600; letter-spacing: -0.025em; margin: 8px 0 24px;\">Hierarquia de Arquivos e Pastas<\u002Fh2>\n\n      <h3 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 19px; font-weight: 600; margin: 30px 0 10px;\">O sistema de arquivos — conceito fundamental<\u002Fh3>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px; text-wrap: pretty;\">O Windows 11 organiza todos os dados em um sistema de arquivos hierárquico — uma estrutura em forma de árvore onde cada nó é uma pasta que pode conter arquivos ou outras pastas. O ponto de partida de toda essa árvore é o disco local, representado pela letra C:\\.<\u002Fp>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px;\">Pense no sistema de arquivos como um armário físico: o disco C:\\ é o armário inteiro, as pastas principais são as gavetas, as subpastas são os compartimentos dentro de cada gaveta, e os arquivos são os documentos guardados dentro de cada compartimento. Você precisa abrir a gaveta certa — navegar até a pasta correta — para encontrar o que procura.<\u002Fp>\n      <div style=\"background: #eef2fd; border: 1px solid #d7e0f8; border-radius: 10px; padding: 16px 18px; margin: 18px 0;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #2a56c6; text-transform: uppercase; margin-bottom: 6px;\">Conceito — Arquivo e pasta<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #2c313c;\">Arquivo: unidade básica de armazenamento (documento, imagem, planilha). Pasta (ou diretório): compartimento que agrupa arquivos e outras pastas. Subpasta: pasta criada dentro de outra pasta.<\u002Fp>\n      <\u002Fdiv>\n      <figure style=\"margin: 0 0 18px;\">\n        <dc-import name=\"Simulacao\" tipo=\"explorador\" hint-size=\"100%,460px\"><\u002Fdc-import>\n      <\u002Ffigure>\n\n      <h3 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 19px; font-weight: 600; margin: 30px 0 10px;\">As pastas padrão do Windows 11 e suas funções<\u002Fh3>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px;\">O Windows 11 cria automaticamente pastas pessoais para cada usuário. Cada uma tem uma finalidade específica:<\u002Fp>\n      <div style=\"overflow-x: auto; margin: 0 0 18px; border: 1px solid #e2e2dd; border-radius: 10px; background: #fff;\">\n        <sc-raw-table style=\"width: 100%; min-width: 600px; border-collapse: collapse; font-size: 14.5px;\">\n          <sc-raw-thead><sc-raw-tr>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Pasta<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Localização<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Finalidade<\u002Fsc-raw-th>\n          <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Documentos<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace; font-size: 13px;\">C:\\Users\\nome\\Documents<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Local padrão para salvar arquivos de trabalho (textos, planilhas)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Downloads<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace; font-size: 13px;\">C:\\Users\\nome\\Downloads<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Destino padrão para arquivos baixados da internet<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Imagens<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace; font-size: 13px;\">C:\\Users\\nome\\Pictures<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Armazenamento de fotos e imagens<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Área de Trabalho<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace; font-size: 13px;\">C:\\Users\\nome\\Desktop<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Ícones e arquivos visíveis diretamente na tela principal<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px;\">Este PC<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Atalho no Explorador<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Acesso rápido aos discos, pen drives e dispositivos conectados<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n\n      <h3 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 19px; font-weight: 600; margin: 30px 0 10px;\">Como ler e construir um caminho de arquivo<\u002Fh3>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px;\">O caminho (path) é o endereço completo de um arquivo no sistema. No Windows 11, cada parte é separada por barras invertidas (\\). Saber ler um caminho é essencial para navegar rapidamente e localizar arquivos precisamente.<\u002Fp>\n      <div style=\"overflow-x: auto; margin: 0 0 18px; border: 1px solid #e2e2dd; border-radius: 10px; background: #fff;\">\n        <sc-raw-table style=\"width: 100%; min-width: 620px; border-collapse: collapse; font-size: 14.5px;\">\n          <sc-raw-thead><sc-raw-tr>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Parte do caminho<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">O que representa<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Exemplo real<\u002Fsc-raw-th>\n          <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">C:\\<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Raiz do disco local — ponto de partida<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">C:\\ é o disco principal; D:\\ seria um segundo disco<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">Users\\<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Pasta com contas de todos os usuários<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Cada usuário tem sua subpasta dentro de Users\\<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">seu_nome\\<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Pasta pessoal do usuário logado<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">C:\\Users\\Maria\\ ou C:\\Users\\aluno\\<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">Documents\\<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Pasta Documentos — local padrão para trabalho<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Equivalente visual de 'Documentos' no Explorador<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">Química_2026\\<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Pasta criada pelo usuário para organização própria<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Pode ter qualquer nome definido pelo usuário<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-famil
