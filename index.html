y: 'JetBrains Mono', monospace;\">1B_Primeiro_Bimestre\\<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Subpasta de organização por período<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Terceiro nível da hierarquia de pastas<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; font-family: 'JetBrains Mono', monospace;\">relatorio.docx<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Arquivo — sempre o item final do caminho<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Nome do arquivo com sua extensão<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n      <div style=\"background: #eef2fd; border: 1px solid #d7e0f8; border-radius: 10px; padding: 16px 18px; margin: 18px 0;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #2a56c6; text-transform: uppercase; margin-bottom: 6px;\">Dica — Barra de endereços interativa<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #2c313c;\">No Explorador de Arquivos do Windows 11, você pode clicar em qualquer parte do caminho exibido na barra de endereços para navegar até ela diretamente. Se a barra mostra Esta PC › Documentos › Química_2026, clique em Documentos para ir direto, sem pressionar o botão de Voltar.<\u002Fp>\n      <\u002Fdiv>\n\n      <h3 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 19px; font-weight: 600; margin: 30px 0 10px;\">Modos de exibição do Explorador — quando usar cada um<\u002Fh3>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px;\">No Explorador do Windows 11, os modos de exibição ficam em Exibir (menu superior). Cada modo é mais adequado para um tipo de tarefa:<\u002Fp>\n      <div style=\"overflow-x: auto; margin: 0 0 18px; border: 1px solid #e2e2dd; border-radius: 10px; background: #fff;\">\n        <sc-raw-table style=\"width: 100%; min-width: 560px; border-collapse: collapse; font-size: 14.5px;\">\n          <sc-raw-thead><sc-raw-tr>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Modo<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Como ativar no Win 11<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Melhor para<\u002Fsc-raw-th>\n          <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Ícones grandes<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Exibir &gt; Ícones extragrandes ou grandes<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Ver miniaturas de imagens — identifica fotos visualmente<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Lista<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Exibir &gt; Lista<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Ver muitos itens rapidamente sem informações extras<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Detalhes<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Exibir &gt; Detalhes<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Ver nome, data de modificação, tipo e tamanho — recomendado para organização<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px;\">Conteúdo<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Exibir &gt; Conteúdo<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Ver prévia do conteúdo de cada arquivo<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n      <div style=\"background: #eef2fd; border: 1px solid #d7e0f8; border-radius: 10px; padding: 16px 18px; margin: 18px 0;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #2a56c6; text-transform: uppercase; margin-bottom: 6px;\">Dica — Modo Detalhes no laboratório<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #2c313c;\">O modo Detalhes é o mais útil porque exibe data de modificação e tamanho — essencial para identificar a versão mais recente de um arquivo. Clique no cabeçalho de qualquer coluna (Nome, Data, Tamanho) para ordenar por aquele critério. Clique novamente para inverter a ordem.<\u002Fp>\n      <\u002Fdiv>\n\n      <dc-import name=\"BlocoQuestoes\" questoes=\"{{ cap4 }}\" placar=\"{{ placar4 }}\" hint-size=\"100%,600px\"><\u002Fdc-import>\n    <\u002Fdiv>\n\n    <div id=\"cap5\" style=\"padding: 64px 0 0;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; color: #2a56c6; text-transform: uppercase;\">Capítulo 5<\u002Fdiv>\n      <h2 style=\"font-family: 'Libre Franklin', sans-serif; font-size: clamp(26px, 5vw, 36px); font-weight: 600; letter-spacing: -0.025em; margin: 8px 0 24px;\">Criação e Manipulação de Arquivos<\u002Fh2>\n\n      <h3 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 19px; font-weight: 600; margin: 30px 0 10px;\">Operações com arquivos — copiar, mover e excluir<\u002Fh3>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px; text-wrap: pretty;\">Gerenciar arquivos é uma das tarefas mais frequentes no uso diário do computador. O Windows 11 oferece atalhos para cada operação — aprendê-los torna o trabalho muito mais rápido do que usar menus. A diferença fundamental entre copiar (Ctrl+C) e recortar (Ctrl+X) é o destino do arquivo original: copiar mantém o original; recortar o move.<\u002Fp>\n      <div style=\"overflow-x: auto; margin: 0 0 18px; border: 1px solid #e2e2dd; border-radius: 10px; background: #fff;\">\n        <sc-raw-table style=\"width: 100%; min-width: 640px; border-collapse: collapse; font-size: 14.5px;\">\n          <sc-raw-thead><sc-raw-tr>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Operação<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Atalho<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">O que acontece<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Diferença fundamental<\u002Fsc-raw-th>\n          <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Copiar<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">Ctrl + C<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Duplica o arquivo; original permanece na origem<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">O item fica em DOIS lugares após colar<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Recortar<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">Ctrl + X<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Marca para mover; remove da origem após colar<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">O item fica em UM lugar — no destino<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Colar<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">Ctrl + V<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Insere o item copiado/recortado no local atual<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Sempre vem após Ctrl+C ou Ctrl+X<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Renomear<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">F2<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Nome do arquivo fica editável<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Enter confirma; Esc cancela sem alterar<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Excluir<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">Delete<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Envia para a Lixeira (recuperável)<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">NÃO exclui permanentemente<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px;\">Excluir permanente<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; font-family: 'JetBrains Mono', monospace;\">Shift + Delete<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Remove sem passar pela Lixeira<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Irreversível — sem recuperação<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n\n      <h3 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 19px; font-weight: 600; margin: 30px 0 10px;\">Selecionando múltiplos arquivos<\u002Fh3>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px;\">Em muitas situações é necessário trabalhar com vários arquivos de uma vez. O Windows 11 oferece quatro métodos de seleção múltipla, cada um mais adequado para uma situação:<\u002Fp>\n      <div style=\"overflow-x: auto; margin: 0 0 18px; border: 1px solid #e2e2dd; border-radius: 10px; background: #fff;\">\n        <sc-raw-table style=\"width: 100%; min-width: 600px; border-collapse: collapse; font-size: 14.5px;\">\n          <sc-raw-thead><sc-raw-tr>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Método<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Como fazer<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Quando usar<\u002Fsc-raw-th>\n          <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Selecionar todos<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">Ctrl + A<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Selecionar todos os itens visíveis na pasta atual de uma vez<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Seleção em bloco<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Clicar no 1º → Shift + clicar no último<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Selecionar um grupo contíguo de itens em sequência na lista<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Seleção individual<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Ctrl + clicar em cada item<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Selecionar itens específicos não consecutivos, um a um<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px;\">Arrastar para selecionar<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Clicar em área vazia e arrastar sobre os itens<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Selecionar vários itens próximos visualmente na pasta<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n\n      <h3 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 19px; font-weight: 600; margin: 30px 0 10px;\">A Lixeira — mecanismo completo de exclusão e recuperação<\u002Fh3>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px;\">A Lixeira é um mecanismo de segurança que evita a perda acidental de dados. Quando você pressiona Delete sobre um arquivo, ele não é apagado do disco imediatamente — é movido para uma pasta especial chamada Lixeira, onde permanece até ser restaurado ou até a Lixeira ser esvaziada manualmente.<\u002Fp>\n      <div style=\"background: #fff; border: 1px solid #e2e2dd; border-radius: 10px; padding: 18px 20px; margin: 0 0 18px;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #5a6070; text-transform: uppercase; margin-bottom: 14px;\">Fluxograma completo da Lixeira<\u002Fdiv>\n        <div style=\"display: grid; gap: 12px;\">\n          <div style=\"display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 15px;\">\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 5px 10px; border-radius: 6px; background: #f2f2ee; border: 1px solid #e2e2dd;\">Arquivo selecionado<\u002Fspan>\n            <span style=\"color: #9aa0ac;\">→<\u002Fspan>\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 5px 10px; border-radius: 6px; background: #eef2fd; border: 1px solid #d7e0f8; color: #2a56c6;\">Delete<\u002Fspan>\n            <span style=\"color: #9aa0ac;\">→<\u002Fspan>\n            <span style=\"font-weight: 600;\">LIXEIRA — arquivo guardado, recuperável<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; gap: 8px; padding-left: 18px; border-left: 1px solid #e2e2dd; margin-left: 8px;\">\n            <div style=\"font-size: 15px; color: #2c313c;\"><strong style=\"font-weight: 600;\">Restaurar<\u002Fstrong> (botão dir. &gt; Restaurar) → o arquivo VOLTA ao local original<\u002Fdiv>\n            <div style=\"font-size: 15px; color: #2c313c;\"><strong style=\"font-weight: 600;\">Esvaziar Lixeira<\u002Fstrong> → exclusão PERMANENTE<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 15px;\">\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 5px 10px; border-radius: 6px; background: #fdf2e8; border: 1px solid #f3ddc4; color: #a75a1f;\">Shift + Delete<\u002Fspan>\n            <span style=\"color: #9aa0ac;\">→<\u002Fspan>\n            <span style=\"font-weight: 600; color: #a7301f;\">EXCLUSÃO PERMANENTE — não pode ser recuperado pelo sistema<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px;\">Para restaurar um arquivo da Lixeira: abra a Lixeira (duplo clique no ícone na Área de Trabalho), localize o arquivo, clique com o botão direito sobre ele e selecione Restaurar. O arquivo voltará exatamente ao local onde estava antes de ser excluído.<\u002Fp>\n      <div style=\"background: #eef2fd; border: 1px solid #d7e0f8; border-radius: 10px; padding: 16px 18px; margin: 18px 0;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #2a56c6; text-transform: uppercase; margin-bottom: 6px;\">Dica — Desfazer exclusão imediata<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #2c313c;\">Imediatamente após excluir com Delete, pressione Ctrl+Z para desfazer. O arquivo sai da Lixeira e volta ao local original — sem precisar abrir a Lixeira. Funciona apenas se for a última ação realizada.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #fdf2e8; border: 1px solid #f3ddc4; border-radius: 10px; padding: 16px 18px; margin: 18px 0;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #a75a1f; text-transform: uppercase; margin-bottom: 6px;\">Atenção — Shift+Delete<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #2c313c;\">Shift+Delete exclui permanentemente sem passar pela Lixeira. Não há forma nativa de recuperar arquivos excluídos assim no Windows 11. Use apenas quando tiver certeza absoluta de que não precisará do arquivo.<\u002Fp>\n      <\u002Fdiv>\n\n      <h3 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 19px; font-weight: 600; margin: 30px 0 10px;\">Renomeando arquivos corretamente<\u002Fh3>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px;\">Renomear com F2 é a forma mais rápida. O nome fica editável no próprio Explorador — você digita o novo nome e pressiona Enter para confirmar, ou Esc para cancelar sem alterações. Boas práticas evitam problemas técnicos e facilitam a localização futura:<\u002Fp>\n      <div style=\"overflow-x: auto; margin: 0 0 18px; border: 1px solid #e2e2dd; border-radius: 10px; background: #fff;\">\n        <sc-raw-table style=\"width: 100%; min-width: 600px; border-collapse: collapse; font-size: 14.5px;\">\n          <sc-raw-thead><sc-raw-tr>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Regra<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Por que importa<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Exemplo correto<\u002Fsc-raw-th>\n          <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Sem espaços<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Espaços podem causar erros em sistemas automatizados<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace; font-size: 13px;\">relatorio_lab.docx (use underline _)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Sem acentos ou cedilha<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Podem causar erros quando transferidos entre sistemas<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace; font-size: 13px;\">apresentacao.pptx (sem ç e acentos)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Nome descritivo<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Facilita encontrar o arquivo depois sem abrir<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace; font-size: 13px;\">relatorio_lab_b1.docx<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px;\">Não alterar a extensão<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Mudar extensão não converte o formato<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Manter .docx, .xlsx, .jpg como estão<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n\n      <dc-import name=\"BlocoQuestoes\" questoes=\"{{ cap5 }}\" placar=\"{{ placar5 }}\" hint-size=\"100%,600px\"><\u002Fdc-import>\n    <\u002Fdiv>\n\n    <div id=\"cap6\" style=\"padding: 64px 0 0;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; color: #2a56c6; text-transform: uppercase;\">Capítulo 6<\u002Fdiv>\n      <h2 style=\"font-family: 'Libre Franklin', sans-serif; font-size: clamp(26px, 5vw, 36px); font-weight: 600; letter-spacing: -0.025em; margin: 8px 0 24px;\">Extensões de Arquivo<\u002Fh2>\n\n      <h3 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 19px; font-weight: 600; margin: 30px 0 10px;\">O que é uma extensão e por que ela importa<\u002Fh3>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px; text-wrap: pretty;\">A extensão de arquivo é o sufixo após o ponto final no nome — por exemplo, em relatorio.docx, a extensão é .docx. Ela serve para duas finalidades: (1) identificar o formato do arquivo; e (2) indicar ao Windows 11 qual programa deve ser usado para abri-lo. Sem a extensão, o sistema não saberia como tratar o arquivo.<\u002Fp>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px;\">O Windows 11 oculta as extensões por padrão para simplificar a aparência dos nomes de arquivo. No entanto, em ambientes técnicos e educacionais, é recomendável ativá-las para ter controle total sobre o que está sendo manipulado.<\u002Fp>\n      <div style=\"background: #eef2fd; border: 1px solid #d7e0f8; border-radius: 10px; padding: 16px 18px; margin: 18px 0;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #2a56c6; text-transform: uppercase; margin-bottom: 6px;\">Conceito — Associação de arquivo<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #2c313c;\">Quando o Windows 11 vincula uma extensão a um programa específico, chamamos de associação de arquivo. Ao dar duplo clique em um arquivo, o sistema consulta essa associação e abre automaticamente o programa correto. A extensão .xlsx está associada ao Excel; .docx ao Word; .pdf ao Edge ou ao Adobe Reader.<\u002Fp>\n      <\u002Fdiv>\n\n      <h3 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 19px; font-weight: 600; margin: 30px 0 10px;\">Extensões mais comuns<\u002Fh3>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px;\">A tabela abaixo mostra as extensões mais usadas com o programa de cada uma. Memorizar essa associação facilita muito o trabalho no Explorador:<\u002Fp>\n      <div style=\"overflow-x: auto; margin: 0 0 18px; border: 1px solid #e2e2dd; border-radius: 10px; background: #fff;\">\n        <sc-raw-table style=\"width: 100%; min-width: 520px; border-collapse: collapse; font-size: 14.5px;\">\n          <sc-raw-thead><sc-raw-tr>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Extensão<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Programa padrão<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Quando usar<\u002Fsc-raw-th>\n          <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">.docx<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Word<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Relatórios e textos<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">.xlsx<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Excel<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Tabelas e planilhas<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">.pptx<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">PowerPoint<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Apresentações<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">.pdf<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Edge / Reader<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Documentos fixos<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">.jpg<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Visualizador<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Fotos e imagens<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">.png<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Visualizador<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Capturas de tela<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">.txt<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Bloco de Notas<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Texto simples<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; font-family: 'JetBrains Mono', monospace;\">.zip<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Explorador<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Pastas comprimidas<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n\n      <h3 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 19px; font-weight: 600; margin: 30px 0 10px;\">Como ativar a exibição de extensões no Windows 11<\u002Fh3>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px;\">No Windows 11, o caminho para ativar extensões foi simplificado. Existem duas formas — a Forma 1 é mais rápida:<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin: 0 0 18px;\">\n        <div style=\"background: #fff; border: 1px solid #e2e2dd; border-radius: 10px; padding: 16px 18px;\">\n          <div style=\"font-family: 'Libre Franklin', sans-serif; font-size: 15px; font-weight: 600; margin-bottom: 8px;\">Forma 1 — Pelo menu Exibir (mais rápida)<\u002Fdiv>\n          <ol style=\"margin: 0; padding-left: 18px; font-size: 15px; line-height: 1.6; color: #2c313c;\">\n            <li>Explorador de Arquivos (Win + E)<\u002Fli>\n            <li>Clicar em 'Exibir' na barra de menus superior<\u002Fli>\n            <li>Mostrar<\u002Fli>\n            <li>Extensões de nome de arquivo (clicar para marcar)<\u002Fli>\n          <\u002Fol>\n        <\u002Fdiv>\n        <div style=\"background: #fff; border: 1px solid #e2e2dd; border-radius: 10px; padding: 16px 18px;\">\n          <div style=\"font-family: 'Libre Franklin', sans-serif; font-size: 15px; font-weight: 600; margin-bottom: 8px;\">Forma 2 — Pelas Opções de pasta<\u002Fdiv>\n          <ol style=\"margin: 0; padding-left: 18px; font-size: 15px; line-height: 1.6; color: #2c313c;\">\n            <li>Explorador de Arquivos<\u002Fli>\n            <li>Menu ⋯ (três pontos) &gt; Opções<\u002Fli>\n            <li>Aba 'Exibição'<\u002Fli>\n            <li>Desmarcar 'Ocultar as extensões dos tipos de arquivo conhecidos'<\u002Fli>\n            <li>Clicar em Aplicar e depois OK<\u002Fli>\n          <\u002Fol>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #eef2fd; border: 1px solid #d7e0f8; border-radius: 10px; padding: 16px 18px; margin: 18px 0;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #2a56c6; text-transform: uppercase; margin-bottom: 6px;\">Alternativa Windows 11<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #2c313c;\">Acesse Exibir &gt; Mostrar &gt; Extensões de nome de arquivo. Essa opção foi adicionada diretamente no menu Exibir do Windows 11, tornando o processo muito mais rápido do que nas versões anteriores.<\u002Fp>\n      <\u002Fdiv>\n\n      <h3 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 19px; font-weight: 600; margin: 30px 0 10px;\">Por que renomear a extensão NÃO converte o arquivo<\u002Fh3>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px;\">Um erro muito comum é tentar converter um arquivo apenas alterando sua extensão. Por exemplo, renomear notas.txt para notas.docx esperando que vire um documento Word. Isso não funciona porque a extensão é apenas um rótulo — o conteúdo interno do arquivo (os dados binários) não é alterado pela renomeação.<\u002Fp>\n      <div style=\"overflow-x: auto; margin: 0 0 18px; border: 1px solid #e2e2dd; border-radius: 10px; background: #fff;\">\n        <sc-raw-table style=\"width: 100%; min-width: 600px; border-collapse: collapse; font-size: 14.5px;\">\n          <sc-raw-thead><sc-raw-tr>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Situação<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">O que acontece<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">O que fazer corretamente<\u002Fsc-raw-th>\n          <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Renomear .txt para .docx<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Word tenta abrir — pode mostrar texto sem formatação ou erros<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Abrir o .txt, copiar o conteúdo e colar em documento Word novo<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px;\">Renomear .png para .jpg<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Arquivo continua PNG internamente — apenas o ícone muda<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Abrir no Paint &gt; Arquivo &gt; Salvar como &gt; selecionar JPEG<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n      <div style=\"background: #fdf2e8; border: 1px solid #f3ddc4; border-radius: 10px; padding: 16px 18px; margin: 18px 0;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #a75a1f; text-transform: uppercase; margin-bottom: 6px;\">Atenção<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #2c313c;\">Renomear a extensão pode inutilizar o arquivo temporariamente. Se fizer isso por engano, renomeie de volta para a extensão original com F2 — o arquivo voltará a funcionar normalmente.<\u002Fp>\n      <\u002Fdiv>\n\n      <dc-import name=\"BlocoQuestoes\" questoes=\"{{ cap6 }}\" placar=\"{{ placar6 }}\" hint-size=\"100%,600px\"><\u002Fdc-import>\n    <\u002Fdiv>\n\n    <div id=\"cap7\" style=\"padding: 64px 0 0;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; color: #2a56c6; text-transform: uppercase;\">Capítulo 7<\u002Fdiv>\n      <h2 style=\"font-family: 'Libre Franklin', sans-serif; font-size: clamp(26px, 5vw, 36px); font-weight: 600; letter-spacing: -0.025em; margin: 8px 0 24px;\">Pesquisa e Localização de Arquivos<\u002Fh2>\n\n      <h3 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 19px; font-weight: 600; margin: 30px 0 10px;\">Por que usar a pesquisa em vez de navegar manualmente<\u002Fh3>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px; text-wrap: pretty;\">Quando você sabe exatamente onde está um arquivo, navegar manualmente pela estrutura de pastas é eficiente. Mas quando não lembra o nome exato, a pasta onde salvou, ou quando precisa encontrar vários arquivos de um tipo específico, a pesquisa do Windows 11 é muito mais rápida — pode localizar em segundos o que levaria minutos para encontrar manualmente.<\u002Fp>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px;\">O Windows 11 mantém um índice de pesquisa — um catálogo interno que registra informações sobre arquivos (nome, localização, data, tipo). Quando você realiza uma busca pelo Menu Iniciar, o sistema consulta esse índice em vez de percorrer todas as pastas, tornando as buscas quase instantâneas.<\u002Fp>\n      <div style=\"background: #eef2fd; border: 1px solid #d7e0f8; border-radius: 10px; padding: 16px 18px; margin: 18px 0;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #2a56c6; text-transform: uppercase; margin-bottom: 6px;\">Conceito — Índice de pesquisa<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #2c313c;\">Catálogo interno do Windows 11 que registra informações sobre os arquivos para acelerar as buscas. É atualizado automaticamente em segundo plano quando você cria, modifica ou exclui arquivos.<\u002Fp>\n      <\u002Fdiv>\n\n      <h3 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 19px; font-weight: 600; margin: 30px 0 10px;\">Representação visual — os três métodos de pesquisa<\u002Fh3>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px;\">A simulação abaixo mostra como cada método se apresenta na tela do Windows 11 e o tipo de resultado que cada um oferece:<\u002Fp>\n      <figure style=\"margin: 0 0 18px;\">\n        <dc-import name=\"Simulacao\" tipo=\"pesquisa\" hint-size=\"100%,380px\"><\u002Fdc-import>\n      <\u002Ffigure>\n\n      <h3 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 19px; font-weight: 600; margin: 30px 0 10px;\">Quando usar cada método<\u002Fh3>\n      <div style=\"overflow-x: auto; margin: 0 0 18px; border: 1px solid #e2e2dd; border-radius: 10px; background: #fff;\">\n        <sc-raw-table style=\"width: 100%; min-width: 660px; border-collapse: collapse; font-size: 14.5px;\">\n          <sc-raw-thead><sc-raw-tr>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Método<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Melhor para<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Vantagem<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Limitação<\u002Fsc-raw-th>\n          <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Menu Iniciar (Win)<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Localizar qualquer programa ou arquivo pelo nome rapidamente<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Pesquisa em todo o computador de uma vez<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Não filtra por extensão ou data diretamente<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Barra do Explorador (*.ext)<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Buscar dentro de uma pasta específica por tipo de arquivo<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Permite filtrar por extensão (*.txt, *.xlsx)<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Restringe a busca à pasta atual e subpastas<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px;\">Filtros avançados<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Combinar extensão + data + tamanho para resultado preciso<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Resultado muito específico com poucos itens<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Requer saber usar os filtros corretamente<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n\n      <h3 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 19px; font-weight: 600; margin: 30px 0 10px;\">Como usar os filtros de pesquisa<\u002Fh3>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px;\">Os filtros são acessados após realizar uma busca inicial na barra do Explorador. Eles aparecem como menus na parte superior dos resultados e podem ser combinados:<\u002Fp>\n      <div style=\"overflow-x: auto; margin: 0 0 18px; border: 1px solid #e2e2dd; border-radius: 10px; background: #fff;\">\n        <sc-raw-table style=\"width: 100%; min-width: 660px; border-collapse: collapse; font-size: 14.5px;\">\n          <sc-raw-thead><sc-raw-tr>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Filtro<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Como acessar<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Opções disponíveis<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Exemplo<\u002Fsc-raw-th>\n          <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Extensão<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Digitar *.extensao na barra<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace; font-size: 13px;\">*.txt, *.docx, *.xlsx, *.pdf, *.jpg<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">*.xlsx para planilhas<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Data de modificação<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Menu Data nos resultados<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Hoje, Esta semana, Este mês, Este ano<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Esta semana para arquivos recentes<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px;\">Tamanho<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Menu Tamanho nos resultados<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Pequeno, Médio, Grande (ou valores exatos)<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Grande para arquivos pesados<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n      <div style=\"background: #fff; border: 1px solid #e2e2dd; border-radius: 10px; padding: 16px 18px; margin: 18px 0;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #12795f; text-transform: uppercase; margin-bottom: 6px;\">Exemplo prático — Busca combinada<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #2c313c;\">Para encontrar planilhas Excel grandes criadas esta semana: na barra do Explorador (em Documentos), digite *.xlsx. Nos menus que aparecem, selecione Data de modificação &gt; Esta semana e Tamanho &gt; Grande. O resultado mostrará apenas planilhas que atendem a todos os critérios simultaneamente.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #fdf2e8; border: 1px solid #f3ddc4; border-radius: 10px; padding: 16px 18px; margin: 18px 0;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #a75a1f; text-transform: uppercase; margin-bottom: 6px;\">Atenção<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #2c313c;\">Se a busca não retornar resultados: (1) o nome está escrito corretamente? Um único caractere errado impede a localização. (2) A extensão digitada é a certa? (3) Você está pesquisando na pasta correta ou em todo o computador?<\u002Fp>\n      <\u002Fdiv>\n\n      <dc-import name=\"BlocoQuestoes\" questoes=\"{{ cap7 }}\" placar=\"{{ placar7 }}\" hint-size=\"100%,600px\"><\u002Fdc-import>\n    <\u002Fdiv>\n\n    <div id=\"cap8\" style=\"padding: 64px 0 0;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; color: #2a56c6; text-transform: uppercase;\">Capítulo 8<\u002Fdiv>\n      <h2 style=\"font-family: 'Libre Franklin', sans-serif; font-size: clamp(26px, 5vw, 36px); font-weight: 600; letter-spacing: -0.025em; margin: 8px 0 24px;\">Instalação e Desinstalação de Programas<\u002Fh2>\n\n      <h3 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 19px; font-weight: 600; margin: 30px 0 10px;\">O que acontece durante a instalação de um programa<\u002Fh3>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px; text-wrap: pretty;\">Instalar um programa no Windows 11 vai muito além de copiar uma pasta. O processo de instalação: (1) copia os arquivos do programa para C:\\Program Files; (2) registra o programa no Registro do Windows — banco de dados interno do sistema; (3) cria atalhos na Área de Trabalho e no Menu Iniciar; (4) pode instalar componentes adicionais como drivers ou bibliotecas de sistema.<\u002Fp>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px;\">É por isso que deletar a pasta de um programa NÃO o desinstala corretamente. Os arquivos no disco são removidos, mas as entradas no Registro, atalhos e componentes espalhados pelo sistema permanecem — causando mensagens de erro e desperdiçando espaço em disco.<\u002Fp>\n      <div style=\"background: #eef2fd; border: 1px solid #d7e0f8; border-radius: 10px; padding: 16px 18px; margin: 18px 0;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #2a56c6; text-transform: uppercase; margin-bottom: 6px;\">Conceito — Registro do Windows<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #2c313c;\">Banco de dados hierárquico interno do Windows 11 que armazena configurações do sistema, informações sobre programas instalados e associações de arquivo. É modificado durante a instalação e deve ser limpo durante a desinstalação correta pelo desinstalador oficial.<\u002Fp>\n      <\u002Fdiv>\n\n      <h3 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 19px; font-weight: 600; margin: 30px 0 10px;\">Instalação segura — passo a passo detalhado<\u002Fh3>\n      <div style=\"display: grid; gap: 12px; margin: 0 0 18px;\">\n        <div style=\"background: #fff; border: 1px solid #e2e2dd; border-radius: 10px; padding: 16px 18px;\">\n          <div style=\"font-family: 'Libre Franklin', sans-serif; font-size: 15px; font-weight: 600; margin-bottom: 8px;\">1 · Fonte oficial<\u002Fdiv>\n          <ul style=\"margin: 0; padding-left: 18px; font-size: 15px; line-height: 1.6; color: #2c313c;\">\n            <li>Acesse o site oficial do fabricante (ex: videolan.org para VLC)<\u002Fli>\n            <li>Verifique: URL começa com https:// e o domínio é o correto<\u002Fli>\n            <li>NUNCA baixe de sites de terceiros, torrents ou links por e-mail<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div style=\"background: #fff; border: 1px solid #e2e2dd; border-radius: 10px; padding: 16px 18px;\">\n          <div style=\"font-family: 'Libre Franklin', sans-serif; font-size: 15px; font-weight: 600; margin-bottom: 8px;\">2 · Baixar o instalador<\u002Fdiv>\n          <ul style=\"margin: 0; padding-left: 18px; font-size: 15px; line-height: 1.6; color: #2c313c;\">\n            <li>Clique no botão de download correto para Windows (64 bits)<\u002Fli>\n            <li>Verifique o nome do arquivo — ex: vlc-3.x.x-win64.exe<\u002Fli>\n            <li>Confira o tamanho aproximado indicado no site<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div style=\"background: #fff; border: 1px solid #e2e2dd; border-radius: 10px; padding: 16px 18px;\">\n          <div style=\"font-family: 'Libre Franklin', sans-serif; font-size: 15px; font-weight: 600; margin-bottom: 8px;\">3 · Executar com atenção<\u002Fdiv>\n          <ul style=\"margin: 0; padding-left: 18px; font-size: 15px; line-height: 1.6; color: #2c313c;\">\n            <li>Duplo clique no instalador baixado<\u002Fli>\n            <li>O Windows exibe aviso do UAC (Controle de Conta de Usuário)<\u002Fli>\n            <li>Leia o nome do programa e o editor — clique Sim apenas se reconhecer<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div style=\"background: #fff; border: 1px solid #e2e2dd; border-radius: 10px; padding: 16px 18px;\">\n          <div style=\"font-family: 'Libre Franklin', sans-serif; font-size: 15px; font-weight: 600; margin-bottom: 8px;\">4 · Seguir o assistente<\u002Fdiv>\n          <ul style=\"margin: 0; padding-left: 18px; font-size: 15px; line-height: 1.6; color: #2c313c;\">\n            <li>Leia cada tela antes de clicar em Avançar<\u002Fli>\n            <li>DESMARQUE software adicional (barras de ferramentas, antivírus extras)<\u002Fli>\n            <li>Mantenha a pasta de destino padrão (C:\\Program Files\\...)<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div style=\"background: #fff; border: 1px solid #e2e2dd; border-radius: 10px; padding: 16px 18px;\">\n          <div style=\"font-family: 'Libre Franklin', sans-serif; font-size: 15px; font-weight: 600; margin-bottom: 8px;\">5 · Confirmar a instalação<\u002Fdiv>\n          <ul style=\"margin: 0; padding-left: 18px; font-size: 15px; line-height: 1.6; color: #2c313c;\">\n            <li>Programa deve aparecer no Menu Iniciar<\u002Fli>\n            <li>Conferir em Configurações (Win+I) &gt; Aplicativos &gt; Aplicativos instalados<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <h3 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 19px; font-weight: 600; margin: 30px 0 10px;\">Entendendo o UAC — Controle de Conta de Usuário<\u002Fh3>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px;\">Ao instalar um programa, o Windows 11 exibe a janela do UAC (User Account Control) pedindo permissão antes de permitir alterações profundas no sistema. Essa janela mostra o nome do programa e o editor (fabricante). É um mecanismo de segurança essencial.<\u002Fp>\n      <div style=\"overflow-x: auto; margin: 0 0 18px; border: 1px solid #e2e2dd; border-radius: 10px; background: #fff;\">\n        <sc-raw-table style=\"width: 100%; min-width: 600px; border-collapse: collapse; font-size: 14.5px;\">\n          <sc-raw-thead><sc-raw-tr>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Situação ao ver o UAC<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">O que fazer<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Por que<\u002Fsc-raw-th>\n          <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Você reconhece o programa e o editor<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Clicar em Sim para permitir<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">A instalação é legítima e você a autorizou<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Você não reconhece o editor<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Clicar em Não e investigar antes<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Pode ser um programa malicioso tentando se instalar<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px;\">Aparece sem você ter iniciado nada<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Clicar em Não imediatamente<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Pode ser vírus ou malware tentando se instalar<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n      <div style=\"background: #fdf2e8; border: 1px solid #f3ddc4; border-radius: 10px; padding: 16px 18px; margin: 18px 0;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #a75a1f; text-transform: uppercase; margin-bottom: 6px;\">Atenção — UAC e segurança<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #2c313c;\">Nunca clique em Sim no UAC sem saber exatamente o que está sendo instalado. O nome e o editor são exibidos — verifique se correspondem ao programa que você escolheu instalar.<\u002Fp>\n      <\u002Fdiv>\n\n      <h3 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 19px; font-weight: 600; margin: 30px 0 10px;\">Desinstalação — por que o método correto importa<\u002Fh3>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px;\">Desinstalar pelo método correto é tão importante quanto a instalação. O desinstalador oficial reverte todas as ações feitas durante a instalação: remove arquivos do disco, limpa entradas do Registro, remove atalhos e reverte configurações. Nenhum método alternativo (deletar pasta, arrastar para Lixeira) faz isso.<\u002Fp>\n\n      <h3 style=\"font-family: 'Libre Franklin', sans-serif; font-size: 19px; font-weight: 600; margin: 30px 0 10px;\">Os dois métodos corretos no Windows 11<\u002Fh3>\n      <p style=\"font-size: 16.5px; line-height: 1.65; color: #2c313c; margin: 0 0 14px;\">A simulação abaixo mostra como cada método aparece na tela real do Windows 11:<\u002Fp>\n      <figure style=\"margin: 0 0 18px;\">\n        <dc-import name=\"Simulacao\" tipo=\"desinstalar\" hint-size=\"100%,420px\"><\u002Fdc-import>\n      <\u002Ffigure>\n      <div style=\"overflow-x: auto; margin: 0 0 18px; border: 1px solid #e2e2dd; border-radius: 10px; background: #fff;\">\n        <sc-raw-table style=\"width: 100%; min-width: 640px; border-collapse: collapse; font-size: 14.5px;\">\n          <sc-raw-thead><sc-raw-tr>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\"><\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Método 1 — Configurações (Win+I)<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align: left; padding: 10px 12px; background: #f2f2ee; font-weight: 600; border-bottom: 1px solid #e2e2dd;\">Método 2 — Menu Iniciar<\u002Fsc-raw-th>\n          <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-weight: 600;\">Caminho<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Win+I &gt; Aplicativos &gt; Aplicativos instalados &gt; ⋯ &gt; Desinstalar<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Iniciar &gt; Todos os aplicativos &gt; botão direito no app &gt; Desinstalar<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9; font-weight: 600;\">Interface<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Lista completa com ícones, tamanho e data de instalação<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px; border-bottom: 1px solid #eeeee9;\">Acesso rápido sem abrir Configurações<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding: 10px 12px; font-weight: 600;\">Quando usar<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 12px;\">Para ver e gerenciar todos os programas de uma vez<\u002Fsc- ;\">Fechar o programa ativo<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding: 9px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">Win+D<\u002Fsc-raw-td><sc-raw-td style=\"padding: 9px 12px; border-bottom: 1px solid #eeeee9;\">Minimizar todas as janelas<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding: 9px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">Win+E<\u002Fsc-raw-td><sc-raw-td style=\"padding: 9px 12px; border-bottom: 1px solid #eeeee9;\">Abrir Explorador de Arquivos<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding: 9px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">Win+Seta Esquerda<\u002Fsc-raw-td><sc-raw-td style=\"padding: 9px 12px; border-bottom: 1px solid #eeeee9;\">Fixar janela no lado esquerdo (Snap)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding: 9px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">Win+Seta Direita<\u002Fsc-raw-td><sc-raw-td style=\"padding: 9px 12px; border-bottom: 1px solid #eeeee9;\">Fixar janela no lado direito (Snap)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding: 9px 12px; border-bottom: 1px solid #eeeee9; font-family: 'JetBrains Mono', monospace;\">Win+I<\u002Fsc-raw-td><sc-raw-td style=\"padding: 9px 12px; border-bottom: 1px solid #eeeee9;\">Abrir Configurações do Windows 11<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding: 9px 12px; font-family: 'JetBrains Mono', monospace;\">Win+Shift+S<\u002Fsc-raw-td><sc-raw-td style=\"padding: 9px 12px;\">Captura de área selecionada<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"glossario\" style=\"padding: 72px 0 0;\">\n      <h2 style=\"font-family: 'Libre Franklin', sans-serif; font-size: clamp(24px, 4.5vw, 32px); font-weight: 600; letter-spacing: -0.02em; margin: 0 0 18px;\">Glossário<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px 26px;\">\n        <div style=\"padding: 12px 0; border-bottom: 1px solid #eaeae5;\"><div style=\"font-weight: 600; font-size: 15.5px; margin-bottom: 3px;\">Área de Transferência<\u002Fdiv><div style=\"font-size: 15px; color: #5a6070; line-height: 1.5;\">Espaço temporário onde ficam dados copiados/recortados até serem colados.<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding: 12px 0; border-bottom: 1px solid #eaeae5;\"><div style=\"font-weight: 600; font-size: 15.5px; margin-bottom: 3px;\">Área de Trabalho<\u002Fdiv><div style=\"font-size: 15px; color: #5a6070; line-height: 1.5;\">Fundo da tela do Windows 11 onde ficam ícones e janelas abertas.<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding: 12px 0; border-bottom: 1px solid #eaeae5;\"><div style=\"font-weight: 600; font-size: 15.5px; margin-bottom: 3px;\">Atalho de teclado<\u002Fdiv><div style=\"font-size: 15px; color: #5a6070; line-height: 1.5;\">Combinação de teclas que executa uma ação sem usar o mouse.<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding: 12px 0; border-bottom: 1px solid #eaeae5;\"><div style=\"font-weight: 600; font-size: 15.5px; margin-bottom: 3px;\">Barra de Tarefas<\u002Fdiv><div style=\"font-size: 15px; color: #5a6070; line-height: 1.5;\">Faixa centralizada no rodapé do Windows 11 com programas abertos e fixados.<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding: 12px 0; border-bottom: 1px solid #eaeae5;\"><div style=\"font-weight: 600; font-size: 15.5px; margin-bottom: 3px;\">Caminho de arquivo<\u002Fdiv><div style=\"font-size: 15px; color: #5a6070; line-height: 1.5;\">Sequência de pastas indicando a localização: C:\\Users\\nome\\Documents\\arquivo.txt<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding: 12px 0; border-bottom: 1px solid #eaeae5;\"><div style=\"font-weight: 600; font-size: 15.5px; margin-bottom: 3px;\">Duplo clique<\u002Fdiv><div style=\"font-size: 15px; color: #5a6070; line-height: 1.5;\">Pressionar o botão esquerdo do mouse duas vezes rápido para abrir um item.<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding: 12px 0; border-bottom: 1px solid #eaeae5;\"><div style=\"font-weight: 600; font-size: 15.5px; margin-bottom: 3px;\">Extensão<\u002Fdiv><div style=\"font-size: 15px; color: #5a6070; line-height: 1.5;\">Sufixo após o ponto no nome (.docx, .xlsx) indicando formato e programa.<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding: 12px 0; border-bottom: 1px solid #eaeae5;\"><div style=\"font-weight: 600; font-size: 15.5px; margin-bottom: 3px;\">Explorador de Arquivos<\u002Fdiv><div style=\"font-size: 15px; color: #5a6070; line-height: 1.5;\">Programa do Windows 11 para navegar e gerenciar arquivos e pastas.<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding: 12px 0; border-bottom: 1px solid #eaeae5;\"><div style=\"font-weight: 600; font-size: 15.5px; margin-bottom: 3px;\">Hierarquia<\u002Fdiv><div style=\"font-size: 15px; color: #5a6070; line-height: 1.5;\">Organização em níveis de pastas com o disco C:\\ como raiz.<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding: 12px 0; border-bottom: 1px solid #eaeae5;\"><div style=\"font-weight: 600; font-size: 15.5px; margin-bottom: 3px;\">Lixeira<\u002Fdiv><div style=\"font-size: 15px; color: #5a6070; line-height: 1.5;\">Local onde o Windows 11 armazena arquivos excluídos temporariamente.<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding: 12px 0; border-bottom: 1px solid #eaeae5;\"><div style=\"font-weight: 600; font-size: 15.5px; margin-bottom: 3px;\">Maximizar<\u002Fdiv><div style=\"font-size: 15px; color: #5a6070; line-height: 1.5;\">Expandir a janela para ocupar toda a tela (botão □).<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding: 12px 0; border-bottom: 1px solid #eaeae5;\"><div style=\"font-weight: 600; font-size: 15.5px; margin-bottom: 3px;\">Minimizar<\u002Fdiv><div style=\"font-size: 15px; color: #5a6070; line-height: 1.5;\">Ocultar a janela sem fechar — fica como ícone na barra de tarefas (botão —).<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding: 12px 0; border-bottom: 1px solid #eaeae5;\"><div style=\"font-weight: 600; font-size: 15.5px; margin-bottom: 3px;\">Pasta<\u002Fdiv><div style=\"font-size: 15px; color: #5a6070; line-height: 1.5;\">Compartimento que agrupa arquivos e outras pastas.<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding: 12px 0; border-bottom: 1px solid #eaeae5;\"><div style=\"font-weight: 600; font-size: 15.5px; margin-bottom: 3px;\">Restaurar<\u002Fdiv><div style=\"font-size: 15px; color: #5a6070; line-height: 1.5;\">Retornar a janela maximizada ao tamanho anterior.<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding: 12px 0; border-bottom: 1px solid #eaeae5;\"><div style=\"font-weight: 600; font-size: 15.5px; margin-bottom: 3px;\">Snap<\u002Fdiv><div style=\"font-size: 15px; color: #5a6070; line-height: 1.5;\">Recurso do Windows 11 que organiza janelas lado a lado com Win+Seta ou mouse.<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding: 12px 0; border-bottom: 1px solid #eaeae5;\"><div style=\"font-weight: 600; font-size: 15.5px; margin-bottom: 3px;\">Subpasta<\u002Fdiv><div style=\"font-size: 15px; color: #5a6070; line-height: 1.5;\">Pasta criada dentro de outra pasta.<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding: 12px 0; border-bottom: 1px solid #eaeae5;\"><div style=\"font-weight: 600; font-size: 15.5px; margin-bottom: 3px;\">Underline<\u002Fdiv><div style=\"font-size: 15px; color: #5a6070; line-height: 1.5;\">Caractere _ usado como separador em nomes de arquivo no lugar do espaço.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"dicas\" style=\"padding: 72px 0 0;\">\n      <h2 style=\"font-family: 'Libre Franklin', sans-serif; font-size: clamp(24px, 4.5vw, 32px); font-weight: 600; letter-spacing: -0.02em; margin: 0 0 18px;\">Dicas para a Avaliação<\u002Fh2>\n      <div style=\"display: grid; gap: 12px;\">\n        <div style=\"background: #fff; border: 1px solid #e2e2dd; border-radius: 10px; padding: 16px 18px;\"><div style=\"font-family: 'Libre Franklin', sans-serif; font-size: 15.5px; font-weight: 600; margin-bottom: 5px;\">Pratique no Windows 11<\u002Fdiv><p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #2c313c;\">Abra o computador e execute cada procedimento desta apostila — especialmente criar pastas, usar o Snap, localizar arquivos pela pesquisa e desinstalar programas.<\u002Fp><\u002Fdiv>\n        <div style=\"background: #fff; border: 1px solid #e2e2dd; border-radius: 10px; padding: 16px 18px;\"><div style=\"font-family: 'Libre Franklin', sans-serif; font-size: 15.5px; font-weight: 600; margin-bottom: 5px;\">Revise os pontos críticos<\u002Fdiv><p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #2c313c;\">Erros frequentes: confundir minimizar com fechar; renomear extensão achando que converte; esquecer Shift+Delete como permanente; não identificar elementos da janela.<\u002Fp><\u002Fdiv>\n        <div style=\"background: #fff; border: 1px solid #e2e2dd; border-radius: 10px; padding: 16px 18px;\"><div style=\"font-family: 'Libre Franklin', sans-serif; font-size: 15.5px; font-weight: 600; margin-bottom: 5px;\">Use as questões como simulado<\u002Fdiv><p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #2c313c;\">Responda todas sem consultar o gabarito. Depois compare e identifique onde precisa revisar.<\u002Fp><\u002Fdiv>\n        <div style=\"background: #fff; border: 1px solid #e2e2dd; border-radius: 10px; padding: 16px 18px;\"><div style=\"font-family: 'Libre Franklin', sans-serif; font-size: 15.5px; font-weight: 600; margin-bottom: 5px;\">Atalhos são fundamentais<\u002Fdiv><p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #2c313c;\">Memorize a tabela de atalhos. Em prova prática, usar atalhos demonstra fluência.<\u002Fp><\u002Fdiv>\n        <div style=\"background: #fff; border: 1px solid #e2e2dd; border-radius: 10px; padding: 16px 18px;\"><div style=\"font-family: 'Libre Franklin', sans-serif; font-size: 15.5px; font-weight: 600; margin-bottom: 5px;\">Consulte as simulações<\u002Fdiv><p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #2c313c;\">Os diagramas da apostila são referências rápidas para o estudo.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:940,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  state = { data: null, answers: {} };\n\n  componentDidMount() {\n    try {\n      const s = JSON.parse(localStorage.getItem(\"apostila-win11-v1\") || \"{}\");\n      if (s && s.answers) this.setState({ answers: s.answers });\n    } catch (e) {}\n    import((window.__resources && window.__resources.quizData) || \"./quiz-data.js\").then(m => this.setState({ data: m.QUESTOES })).catch(e => console.error(e));\n  }\n\n  responder(qid, idx) {\n    if (this.state.answers[qid] !== undefined) return;\n    const answers = Object.assign({}, this.state.answers, { [qid]: idx });\n    this.setState({ answers });\n    try { localStorage.setItem(\"apostila-win11-v1\", JSON.stringify({ answers })); } catch (e) {}\n  }\n\n  reiniciar() {\n    this.setState({ answers: {} });\n    try { localStorage.setItem(\"apostila-win11-v1\", JSON.stringify({ answers: {} })); } catch (e) {}\n  }\n\n  montarCapitulo(n) {\n    const letras = [\"(A)\", \"(B)\", \"(C)\", \"(D)\", \"(E)\"];\n    const lista = (this.state.data && this.state.data[n]) || [];\n    return lista.map(q => {\n      const escolha = this.state.answers[q.id];\n      const respondida = escolha !== undefined;\n      const acertou = respondida && escolha === q.correta;\n      const figuras = {\n        \"img/image1.jpg\": \"desktop\", \"img/image2.jpg\": \"janela\", \"img/image3.jpg\": \"mouse\",\n        \"img/image4.jpg\": \"estados\", \"img/image5.jpg\": \"snap\", \"img/image6.jpg\": \"explorador\",\n        \"img/image7.jpg\": \"pesquisa\", \"img/image8.jpg\": \"desinstalar\"\n      };\n      return {\n        id: q.id,\n        figura: figuras[q.img] || \"\",\n        temImagem: !!q.img,\n        ref: q.ref || \"\",\n        temRef: !!q.ref,\n        enunciado: q.enunciado,\n        respondida,\n        feedback: acertou ? \"Correto.\" : \"Incorreto. A resposta certa é \" + letras[q.correta] + \" \" + q.alt[q.correta],\n        feedbackCor: acertou ? \"#12795f\" : \"#a7301f\",\n        alternativas: q.alt.map((texto, i) => {\n          let bg = \"#fbfbfa\", bd = \"#e2e2dd\", fg = \"#2c313c\", marca = \"\";\n          if (respondida) {\n            if (i === q.correta) { bg = \"#e9f5f0\"; bd = \"#9dcfbe\"; fg = \"#0f5f4b\"; marca = \"✓\"; }\n            else if (i === escolha) { bg = \"#fdeceb\"; bd = \"#efbdb7\"; fg = \"#912a1c\"; marca = \"✕\"; }\n            else { bg = \"#fbfbfa\"; bd = \"#eeeee9\"; fg = \"#7a808c\"; }\n          }\n          return { letra: letras[i], texto, bg, bd, fg, marca, onClick: () => this.responder(q.id, i) };\n        })\n      };\n    });\n  }\n\n  placar(n) {\n    const lista = (this.state.data && this.state.data[n]) || [];\n    let resp = 0, ok = 0;\n    lista.forEach(q => {\n      const e = this.state.answers[q.id];\n      if (e !== undefined) { resp++; if (e === q.correta) ok++; }\n    });\n    return resp === 0 ? \"0 de 7 respondidas\" : ok + \" acertos · \" + resp + \" de 7 respondidas\";\n  }\n\n  renderVals() {\n    const letras = [\"(A)\", \"(B)\", \"(C)\", \"(D)\", \"(E)\"];\n    const vals = {};\n    for (let n = 1; n <= 8; n++) {\n      vals[\"cap\" + n] = this.montarCapitulo(n);\n      vals[\"placar\" + n] = this.placar(n);\n    }\n    const todas = [];\n    for (let n = 1; n <= 8; n++) todas.push(...(((this.state.data || {})[n]) || []));\n    const respondidas = todas.filter(q => this.state.answers[q.id] !== undefined);\n    const acertos = respondidas.filter(q => this.state.answers[q.id] === q.correta).length;\n    vals.progressoTexto = respondidas.length + \"/56 · \" + acertos + \" acertos\";\n    vals.progressoLargura = Math.round((respondidas.length / 56) * 100) + \"%\";\n    vals.gabarito = todas.map(q => ({ id: q.id, letra: letras[q.correta] }));\n    vals.reiniciar = () => this.reiniciar();\n    return vals;\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
